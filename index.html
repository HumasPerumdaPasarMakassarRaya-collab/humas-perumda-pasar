<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login HUMAS</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family: Arial, Helvetica, sans-serif;
}

html, body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
}

.wrapper{
    position:relative;
    width:100%;
    height:100vh;
}

.wrapper img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.form{
    position:absolute;
    top:45%;
    left:52%;
    transform:translate(-50%, -50%);
    width:60%;
    max-width:360px;
}

input{
    width:100%;
    padding:8px;
    margin-bottom:3px;
    border:3px solid #000;
    border-radius:14px;
    font-size:16px;
}

button{
    width:100%;
    padding:8px;
    background:#FFD600;
    border:3px solid #000;
    border-radius:18px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(0.95);
}

#msg{
    text-align:center;
    margin-top:5px;
    margin-left:-20px;
    font-weight:bold;
}

@keyframes shake{
    0%{transform:translate(-50%, -50%) translateX(0);}
    25%{transform:translate(-50%, -50%) translateX(-8px);}
    50%{transform:translate(-50%, -50%) translateX(8px);}
    75%{transform:translate(-50%, -50%) translateX(-8px);}
    100%{transform:translate(-50%, -50%) translateX(0);}
}

@keyframes pop{
    0%{transform:translate(-50%, -50%) scale(1);}
    50%{transform:translate(-50%, -50%) scale(1.08);}
    100%{transform:translate(-50%, -50%) scale(1);}
}

.shake{animation:shake 0.4s;}
.pop{animation:pop 0.3s;}
</style>
</head>

<body>

<div class="wrapper">
    <img src="img/bg_login.jpg" alt="Login HUMAS">

    <div class="form">
        <input type="email" id="username" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">LOGIN</button>
        <div id="msg"></div>
    </div>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  signOut
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

/* =====================
   FIREBASE CONFIG
===================== */
const firebaseConfig = {
  apiKey: "AIzaSyAzM_PfoVc-YSDy1Ffqlkdl8Pj161KJAk4",
  authDomain: "testproject1-16f3a.firebaseapp.com",
  projectId: "testproject1-16f3a",
  storageBucket: "testproject1-16f3a.firebasestorage.app",
  messagingSenderId: "677267745961",
  appId: "1:677267745961:web:f0844a1e4e6764bf32cdb8"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* =====================
   OPSI 1 — EMAIL WHITELIST
===================== */
const allowedEmails = [
  "dokumentasi@humas.id",
  "agenda@humas.id",
  "admin@humas.id"
];

/* =====================
   LOGIN
===================== */
window.login = function(){
  const email = document.getElementById("username").value.trim();
  const pass  = document.getElementById("password").value.trim();
  const msg   = document.getElementById("msg");
  const form  = document.querySelector(".form");

  if(!email || !pass){
    msg.innerHTML = "❗ Lengkapi Data";
    msg.style.color = "red";
    shake(form);
    return;
  }

  signInWithEmailAndPassword(auth, email, pass)
  .then((cred)=>{
    const user = cred.user;

    /* CEK EMAIL (OPSI 1) */
    if(!allowedEmails.includes(user.email)){
      msg.innerHTML = "❌ Akun Tidak Terdaftar";
      msg.style.color = "red";
      signOut(auth);
      shake(form);
      return;
    }

    /* LOGIN BERHASIL */
    localStorage.setItem("login","true");
    localStorage.setItem("user", user.email);

    msg.innerHTML = "✅ Login Berhasil";
    msg.style.color = "green";
    pop(form);

    // setTimeout(()=>window.location.href="home.html",800);
  })
  .catch(()=>{
    msg.innerHTML = "❌ Login Gagal";
    msg.style.color = "red";
    shake(form);
  });
};
</script>

</body>
</html>
